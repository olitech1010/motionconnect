<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Redirecting to Portal...</title>
<!-- MikroTik variables will be replaced by the router before this is sent to the client -->
<meta http-equiv="refresh" content="0; url=https://motionconnect.vercel.app/?mac=$(mac)&ip=$(ip)&username=$(username)&link-login-only=$(link-login-only)&link-orig=$(link-orig)&error=$(error)">
</head>
<body>
<p>If you are not redirected automatically, <a href="https://motionconnect.vercel.app/?mac=$(mac)&ip=$(ip)&username=$(username)&link-login-only=$(link-login-only)&link-orig=$(link-orig)&error=$(error)">click here</a>.</p>
</body>
</html>
